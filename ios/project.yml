name: CommuteScoutDrive
options:
  bundleIdPrefix: com.commutescout
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: M7D6YHVDNK
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.1"
packages:
  Ferrostar:
    url: https://github.com/stadiamaps/ferrostar
    exactVersion: 0.56.0
  MapLibreSwiftUI:
    url: https://github.com/maplibre/swiftui-dsl
    from: 0.25.0
targets:
  CommuteScoutDrive:
    type: application
    platform: iOS
    sources:
      - path: CommuteScoutDrive
    dependencies:
      - package: Ferrostar
        product: FerrostarCore
      - package: Ferrostar
        product: FerrostarSwiftUI
      - package: Ferrostar
        product: FerrostarMapLibreUI
      - package: MapLibreSwiftUI
        product: MapLibreSwiftUI
      - package: MapLibreSwiftUI
        product: MapLibreSwiftDSL
    info:
      path: CommuteScoutDrive/Info.plist
      properties:
        CFBundleDisplayName: CommuteScout Drive
        CFBundleName: CommuteScout Drive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: CommuteScout Drive uses your location to navigate and to warn you about what is ahead on the road.
        NSLocationAlwaysAndWhenInUseUsageDescription: Keep navigation running when the screen is off or another app is in front.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.commutescout.drive
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: -DDEBUG
        Release:
          # TestFlight builds sign manually from the build keychain that
          # scripts/ios_signing.sh sets up (see scripts/ios_build.sh).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: CommuteScout Drive AppStore

name: CommuteScoutDrive
options:
  bundleIdPrefix: com.commutescout
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: M7D6YHVDNK
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.1"
packages:
  Ferrostar:
    url: https://github.com/stadiamaps/ferrostar
    exactVersion: 0.56.0
  MapLibreSwiftUI:
    url: https://github.com/maplibre/swiftui-dsl
    from: 0.25.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
  # On-device neural voices (docs/voices.md). A static xcframework with
  # ONNX Runtime; no espeak-ng or other GPL code since 2.0.0.
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 2.0.0
targets:
  CommuteScoutDrive:
    type: application
    platform: iOS
    sources:
      - path: CommuteScoutDrive
        excludes:
          - "Map"
      # The base map's styles, fonts and sprites, kept as a folder so the
      # paths inside the bundle stay what the styles expect.
      - path: CommuteScoutDrive/Map
        type: folder
        buildPhase: resources
      # The voice catalog both apps read: packs, files, hashes, licenses.
      - path: ../shared/voices.json
        buildPhase: resources
    dependencies:
      - package: Ferrostar
        product: FerrostarCore
      - package: Ferrostar
        product: FerrostarSwiftUI
      - package: Ferrostar
        product: FerrostarMapLibreUI
      - package: MapLibreSwiftUI
        product: MapLibreSwiftUI
      - package: MapLibreSwiftUI
        product: MapLibreSwiftDSL
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: SherpaOnnx
        product: sherpa-onnx
    postBuildScripts:
      # onnxruntime 1.28.2's binary is built for iOS 16.1, but its
      # Info.plist claims 13.0, and App Store Connect rejects the upload
      # (ITMS-90208). Make every embedded framework's plist state its
      # binary's real minimum, then sign the framework again.
      - name: Match framework minimum OS to its binary
        basedOnDependencyAnalysis: false
        script: |
          bash "$SRCROOT/../scripts/ios_framework_minos.sh"
    entitlements:
      path: CommuteScoutDrive/CommuteScoutDrive.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
    info:
      path: CommuteScoutDrive/Info.plist
      properties:
        CFBundleDisplayName: CommuteScout Drive
        CFBundleName: CommuteScout Drive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: CommuteScout Drive uses your location to navigate and to warn you about what is ahead on the road.
        ITSAppUsesNonExemptEncryption: false
        # Onest, the app's typeface (SIL Open Font License, Fonts/Onest-OFL.txt).
        UIAppFonts:
          - Onest.ttf
        GIDClientID: 15002631928-mkrc3g1n231pec0k9fvlabuaf2ja7mkh.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.15002631928-mkrc3g1n231pec0k9fvlabuaf2ja7mkh
        UIApplicationSupportsIndirectInputEvents: true
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.commutescout.drive
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: -DDEBUG
          # Debug builds for a real phone (scripts/ios_build.sh test-device)
          # sign with the Development certificate and profile that
          # asc-setup/devcert.py made; simulator builds ignore these.
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": CommuteScout Drive Dev
        Release:
          # TestFlight builds sign manually from the build keychain that
          # scripts/ios_signing.sh sets up (see scripts/ios_build.sh).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: CommuteScout Drive AppStore
  # Logic tests that need no app or simulator state: they compile the
  # files they test rather than loading the app, so they run in seconds.
  CommuteScoutDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: CommuteScoutDrive/VoicePick.swift
      - path: CommuteScoutDrive/VoiceCatalog.swift
      - path: CommuteScoutDrive/VoicePackFiles.swift
      - path: CommuteScoutDrive/KokoroText.swift
      - path: CommuteScoutDrive/NeuralPlan.swift
      - path: CommuteScoutDrive/Backend.swift
      - path: CommuteScoutDrive/EventText.swift
      - path: CommuteScoutDrive/EventAlerts.swift
      - path: CommuteScoutDrive/DayGlass/LaneLayout.swift
      - path: CommuteScoutDrive/DayGlass/DGKind.swift
      - path: CommuteScoutDrive/DayGlass/SystemNotes.swift
      - path: ../shared/voices.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.commutescout.drive.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  CommuteScoutDriveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CommuteScoutDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.commutescout.drive.uitests
        TEST_TARGET_NAME: CommuteScoutDrive
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": CommuteScout Drive Dev Runner
schemes:
  CommuteScoutDrive:
    build:
      targets:
        CommuteScoutDrive: all
        CommuteScoutDriveUITests: [test]
        CommuteScoutDriveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CommuteScoutDriveTests
        - CommuteScoutDriveUITests
    archive:
      config: Release

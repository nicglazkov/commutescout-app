# Android has had a build check since the audit; iOS had none, so half
# the product could only be verified on a Mac that happened to be awake.
# A hosted macOS runner has Xcode and the simulators already, and this
# repository is public, so the minutes are free.
#
# Signing is off: this proves the code compiles and the unit tests pass,
# not that it can be shipped. Shipping still goes through scripts/ios_build.sh
# on the maintainer's Mac, which has the certificates.
name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    # Read only, stated rather than inherited. This job needs nothing
    # else: it holds no secrets, signs nothing, and produces nothing
    # installable, so there is no reason for it to be able to write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        # A pinned release rather than "brew install xcodegen". Homebrew
        # has no versioned formula for it, so brew is whatever shipped
        # today: third-party code running in the build. This runner
        # holds no secrets and cannot write to the repository, so the
        # worst case is a green tick it did not earn, which is still
        # worth preventing. Bump the version deliberately.
        run: |
          curl -fsSL -o xcodegen.zip             https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-dist
          # The archive's internal layout is the release's business, not
          # ours: find the binary rather than assuming where it sits.
          bin=$(find xcodegen-dist -type f -name xcodegen -perm +111 | head -1)
          test -n "$bin" || { echo "xcodegen not found in the release"; exit 1; }
          chmod +x "$bin"
          echo "$PWD/$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        working-directory: ios
        run: |
          xcodebuild -project CommuteScoutDrive.xcodeproj \
            -scheme CommuteScoutDrive \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -40
          exit ${PIPESTATUS[0]}
      - name: Pick the simulator
        id: sim
        # A device id, not a name: a name can match several runtimes on a
        # hosted image, and xcodebuild then chooses for itself. The newest
        # iOS 18 runtime's iPhone 16, or a plain failure saying so.
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios18 = [r for r in runtimes if ".iOS-18-" in r]
          ios18.sort(key=lambda r: [int(n) for n in r.rsplit("iOS-", 1)[1].split("-")])
          for runtime in reversed(ios18):
              for device in runtimes[runtime]:
                  if device["name"] == "iPhone 16":
                      print(device["udid"])
                      sys.exit()
          ')
          test -n "$udid" || { echo "No iPhone 16 on an iOS 18 runtime on this image"; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        # Their own scheme, so this builds the logic tests alone. They
        # compile the files they test and load no app, so no
        # GoogleService-Info.plist is needed. UI tests stay on the Mac.
        working-directory: ios
        timeout-minutes: 20
        run: |
          xcodebuild -project CommuteScoutDrive.xcodeproj             -scheme CommuteScoutDriveTests             -destination "id=${{ steps.sim.outputs.udid }}"             -derivedDataPath build             -skipMacroValidation             -parallel-testing-enabled NO             CODE_SIGNING_ALLOWED=NO             test 2>&1 | tail -60
          exit ${PIPESTATUS[0]}
